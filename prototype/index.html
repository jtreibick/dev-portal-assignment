<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compass Developer Portal - Deployment prototype</title>
  <style>
    :root{--nav:#101828;--nav2:#182638;--ink:#172033;--muted:#667085;--line:#dfe4ea;--bg:#f5f7fa;--card:#fff;--blue:#1859d1;--blue2:#eaf1ff;--green:#087a55;--green2:#e8f7f1;--amber:#a45b09;--amber2:#fff5df;--purple:#6941c6;--shadow:0 1px 2px rgba(16,24,40,.06),0 5px 18px rgba(16,24,40,.04)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.48 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
    .sidebar{background:var(--nav);color:#cbd5e1;padding:24px 17px;position:relative}
    .brand{color:#fff;font-size:17px;font-weight:750;padding:0 10px 25px}
    .brand small{display:block;color:#90a1bb;font-size:11px;font-weight:500;margin-top:3px}
    .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#71829b;margin:19px 10px 7px}
    .nav-btn{width:100%;border:0;text-align:left;color:#bcc7d9;background:transparent;padding:9px 11px;border-radius:7px;margin:2px 0;display:flex;align-items:center;gap:9px}
    .nav-btn:hover,.nav-btn.active{background:#263751;color:#fff}
    .nav-btn .count{margin-left:auto;color:#8da0bd}
    .nav-icon{width:17px;text-align:center;color:#91a4c1;font-size:15px}
    .sample{position:absolute;left:27px;bottom:22px;color:#7f91ab;font-size:11px}
    .main{min-width:0}
    .content{max-width:1250px;margin:0 auto;padding:29px 38px 60px}
    .section-head{display:flex;justify-content:space-between;gap:16px;align-items:start}
    .eyebrow{color:var(--blue);font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase}
    h1{font-size:29px;line-height:1.2;margin:5px 0 9px}
    h2{font-size:18px;margin:0 0 8px}
    h3{font-size:14px;margin:0 0 6px}
    .lede{max-width:780px;color:var(--muted);margin:0 0 22px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
    .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid.main-aside{grid-template-columns:minmax(0,1.6fr) minmax(300px,.7fr)}
    .label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#748196;font-weight:750}
    .value{font-weight:700;margin-top:4px}
    .muted{color:var(--muted)}
    .source{color:#6b7280;font-size:11px;margin-top:4px}
    .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:99px;background:var(--green2);color:var(--green)}
    .pill.blue{background:var(--blue2);color:var(--blue)}
    .pill.amber{background:var(--amber2);color:var(--amber)}
    .row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid #edf0f3}
    .row:last-child{border-bottom:0}
    .row>span:last-child{text-align:right}
    .btn{border:1px solid #cad3df;background:#fff;color:var(--ink);padding:9px 13px;border-radius:7px;font-weight:650}
    .btn:hover{background:#f7f9fc}
    .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .btn.quiet{border-color:transparent;color:var(--blue);background:transparent}
    .actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px}
    .right-actions{display:flex;gap:9px;flex-wrap:wrap}
    .crumb{font-size:12px;margin-bottom:16px}
    .fact{padding:13px;border:1px solid var(--line);border-radius:8px;background:#fff}
    .fact.changed{border-color:#c4b5fd;background:#faf8ff}
    .app-card{padding:0;overflow:hidden}
    .app-list-card{padding:0;overflow:hidden}
    .app-list-head{padding:13px 15px 9px;display:flex;justify-content:space-between;gap:13px;align-items:start}
    .app-list-body{padding:0 15px 9px}
    .compact-summary{display:flex;gap:8px 18px;flex-wrap:wrap;color:var(--muted);font-size:12px}
    .compact-summary b{color:var(--ink)}
    .expanded-details{padding:4px 15px 12px;border-top:1px solid #edf0f3}
    .text-action{border:0;background:transparent;color:var(--blue);font-weight:700;padding:0;text-align:left}
    .text-action:hover{text-decoration:underline}
    .tiny-edit{font-size:11px;margin-left:7px;font-weight:700}
    .card-actions{padding:9px 15px;border-top:1px solid var(--line);display:flex;gap:18px}
    .inventory-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}
    .search-box{min-width:320px;max-width:470px;width:100%;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 12px}
    .pagination{display:flex;align-items:center;gap:5px;margin-top:14px}
    .pagination button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 9px}
    .pagination button.active{background:var(--nav);color:#fff;border-color:var(--nav)}
    .pagination button:disabled{color:#a4adba;background:#f1f3f6}
    .activity-section{margin-top:42px;padding-top:30px;border-top:1px solid var(--line)}
    .change-table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
    .activity-table{width:100%;border-collapse:collapse}
    .activity-table th{text-align:left;color:#748196;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:10px;border-bottom:1px solid var(--line);background:#fbfcfd}
    .activity-table td{padding:13px 10px;border-bottom:1px solid #edf0f3;vertical-align:top}
    .activity-table tr:last-child td{border-bottom:0}
    .nowrap{white-space:nowrap}
    .tabs{display:flex;gap:3px;padding:0 16px;border-bottom:1px solid var(--line);overflow:auto}
    .tabs button{border:0;background:transparent;color:#667085;padding:12px 10px;border-bottom:2px solid transparent;white-space:nowrap}
    .tabs button.active{border-color:var(--blue);color:var(--blue);font-weight:700}
    .app-body{padding:18px}
    .environment-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
    .environment-card{border:1px solid var(--line);border-radius:8px;padding:13px}
    .environment-card.pending{border-style:dashed;background:#fbfcfd}
    .timeline{display:grid;gap:0}
    .timeline-item{padding:11px 0 11px 17px;border-left:2px solid #d6deea;position:relative}
    .timeline-item:before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:var(--blue);left:-5px;top:17px}
    .agent-note{border-left:4px solid var(--purple);background:#f8f5ff}
    .agent-note .eyebrow{color:var(--purple)}
    .pattern{border-left:4px solid var(--blue)}
    .component{display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #edf0f3}
    .component:last-child{border-bottom:0}
    .why{font-size:12px;color:var(--muted)}
    .policy{font-size:11px;color:#57657a;background:#f0f3f7;border-radius:5px;padding:3px 6px;white-space:nowrap}
    .code{font:12px/1.65 ui-monospace,SFMono-Regular,monospace;background:#101828;color:#d9e4f5;padding:15px;border-radius:8px;white-space:pre-wrap}
    .check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #edf0f3}
    .check:last-child{border-bottom:0}
    .checkmark{width:20px;height:20px;border-radius:50%;background:var(--green2);color:var(--green);display:grid;place-items:center;font-weight:900;flex:0 0 auto}
    .success{max-width:800px;margin:20px auto;text-align:center;padding:38px}
    .success-icon{width:50px;height:50px;margin:0 auto 13px;border-radius:50%;background:var(--green2);color:var(--green);font-size:28px;display:grid;place-items:center}
    .shallow{max-width:800px}
    .empty-icon{font-size:30px;margin-bottom:9px}
    .hidden{display:none!important}
    .ask-fab{position:fixed;right:24px;bottom:22px;z-index:18;width:48px;height:48px;border:1px solid #314057;border-radius:50%;background:var(--nav);color:#fff;display:grid;place-items:center;box-shadow:0 13px 32px #10182866,0 4px 10px #1018283d}
    .ask-fab:hover{background:var(--nav2)}
    .ask-fab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .chat-drawer{position:fixed;right:0;top:0;bottom:0;width:min(410px,100vw);background:#fff;z-index:30;box-shadow:-16px 0 45px #1018282b;display:flex;flex-direction:column}
    .chat-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start}
    .chat-body{padding:18px;overflow:auto;flex:1;min-height:0}
    .chat-context{background:#f4f7fb;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:16px}
    .chat-thread{display:grid;gap:10px}
    .assistant-message{background:#e9edf3;border:1px solid #d0d5dd;border-left:3px solid #98a2b3;padding:11px 12px;border-radius:8px;margin-right:20px}
    .assistant-message .label{color:#667085!important}
    .user-message{background:#0f766e;color:#fff;padding:10px 12px;border-radius:8px 8px 2px 8px;margin-left:42px}
    .chat-prompts{display:grid;gap:7px}
    .chat-prompts button{border:1px solid var(--line);background:#fff;text-align:left;padding:9px 10px;border-radius:7px;color:var(--ink)}
    .chat-prompts button:hover{border-color:#9db7e8;background:#f7f9ff}
    .chat-prompts button.primary-prompt{background:var(--blue);border-color:var(--blue);color:#fff}
    .chat-bottom{height:1px}
    .chat-composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
    .chat-composer input{min-width:0;flex:1;border:1px solid #cbd5e1;border-radius:7px;padding:9px}
    #sendChat{background:var(--nav);border-color:var(--nav);color:#fff}
    #sendChat:hover{background:var(--nav2)}
    .connection-card{padding:0;overflow:hidden}
    .connection-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}
    .connection-body{padding:16px 18px}
    .scope-list{display:grid;gap:8px;margin-top:13px}
    .scope-item{display:flex;gap:9px;align-items:start}
    .scope-dot{width:18px;height:18px;border-radius:50%;background:var(--green2);color:var(--green);display:grid;place-items:center;font-size:11px;font-weight:900;flex:0 0 auto}
    .setup-code{font:12px/1.55 ui-monospace,SFMono-Regular,monospace;background:#101828;color:#dbe7f8;padding:12px;border-radius:7px;overflow:auto;white-space:pre}
    .setup-notice{padding:11px;border-radius:7px;background:var(--green2);color:var(--green);margin-top:12px}
    button:focus,input:focus,select:focus,textarea:focus{outline:3px solid #b9d1ff;outline-offset:2px}
    @media(max-width:820px){.shell{display:block}.sidebar{display:none}.content{padding:22px 16px 50px}.section-head{display:block}.grid,.grid.three,.grid.main-aside,.environment-grid{grid-template-columns:1fr}.component{grid-template-columns:1fr}.policy{width:max-content}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">Compass<small>Developer portal</small></div>
      <div class="nav-label">Build & run</div>
      <button class="nav-btn active" data-destination="applications"><span class="nav-icon" aria-hidden="true">▦</span>Applications</button>
      <button class="nav-btn" data-destination="deploy"><span class="nav-icon" aria-hidden="true">↑</span>Deploy</button>
      <button class="nav-btn" data-destination="changes"><span class="nav-icon" aria-hidden="true">≡</span>Changes <span class="count">3</span></button>
      <div class="nav-label">Platform</div>
      <button class="nav-btn" data-destination="patterns"><span class="nav-icon" aria-hidden="true">◆</span>Approved patterns</button>
      <button class="nav-btn" data-destination="standards"><span class="nav-icon" aria-hidden="true">✓</span>Standards</button>
      <button class="nav-btn" data-destination="connect"><span class="nav-icon" aria-hidden="true">⌘</span>Connect tools</button>
      <button class="nav-btn" data-destination="help"><span class="nav-icon" aria-hidden="true">?</span>Get help</button>
      <div class="sample">Concept prototype · Sample data</div>
    </aside>
    <div class="main">
      <main class="content" id="content"></main>
    </div>
  </div>

  <button class="ask-fab" id="askCompass" aria-label="Ask Compass" title="Ask Compass"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.4 8.4 0 0 1-3.5-.8L4 20l1.4-4A7.2 7.2 0 0 1 4 11.5 7.5 7.5 0 0 1 12 4a7.5 7.5 0 0 1 8 7.5Z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/></svg><span class="sr-only">Ask Compass</span></button>

  <aside class="chat-drawer hidden" id="chatDrawer" aria-label="Compass assistant">
    <div class="chat-head">
      <div><div class="eyebrow">Contextual assistant</div><h2 style="margin:2px 0 0">Ask Compass</h2></div>
      <button class="btn" id="closeChat">Close</button>
    </div>
    <div class="chat-body">
      <div class="chat-context" id="chatContext"></div>
      <div class="chat-thread" id="chatThread"></div>
      <div class="label" id="chatPromptLabel" style="margin:17px 0 8px">Things you can ask Compass to do</div>
      <div class="chat-prompts" id="chatPrompts"></div>
      <div class="chat-bottom" id="chatBottom" aria-hidden="true"></div>
    </div>
    <div class="chat-composer">
      <input id="chatInput" aria-label="Message Compass" placeholder="Ask about this application...">
      <button class="btn primary" id="sendChat">Send</button>
    </div>
  </aside>

  <aside class="chat-drawer hidden" id="serviceDrawer" aria-label="Action drawer">
    <div class="chat-head">
      <div><div class="eyebrow">Portal action</div><h2 id="serviceDrawerTitle" style="margin:2px 0 0">Action</h2></div>
      <button class="btn" id="closeServiceDrawer">Close</button>
    </div>
    <div class="chat-body" id="serviceDrawerBody"></div>
  </aside>

  <script>
    const state={view:'workspace',selectedService:'checkout-api',traffic:'',data:'',availability:'99.9%',region:'us-east-1',capacity:'Standard',changed:false,pattern:'standard',tuning:false,customVariation:false,customReason:'',validated:false,pr:false,agentInstalled:false,ideConnected:false,tokenDraft:false,deployStep:0,deploymentConversationComplete:false};
    const content=document.getElementById('content');

    const applicationCatalog={
      'checkout-api':{kind:'Customer-facing API',description:'Customer checkout and payment orchestration',lifecycle:'Pre-production',lifecycleClass:'amber',serviceOwner:'Commerce Platform',ownerEmail:'commerce-platform@company.com',team:'Your team',infraOwner:'Cloud Platform',infraEmail:'cloud-platform@company.com',environments:'Development · Staging',repo:'github.company.com/commerce/checkout-api',activity:'Last deployed to staging 2h ago'},
      'catalog-web':{kind:'Internal web application',description:'Merchandising and product catalog workspace',lifecycle:'Production',lifecycleClass:'',serviceOwner:'Commerce Platform',ownerEmail:'commerce-platform@company.com',team:'Your team',infraOwner:'Commerce Platform',infraEmail:'commerce-platform@company.com',environments:'Development · Production',repo:'github.company.com/commerce/catalog-web',activity:'Healthy · no open changes'},
      'payments-worker':{kind:'Background worker',description:'Payment settlement and reconciliation jobs',lifecycle:'Production',lifecycleClass:'',serviceOwner:'Payments',ownerEmail:'payments-platform@company.com',team:'Contributing team',infraOwner:'Cloud Platform',infraEmail:'cloud-platform@company.com',environments:'Staging · Production',repo:'github.company.com/payments/payments-worker',activity:'Policy update awaiting review'},
      'inventory-sync':{kind:'Event consumer',description:'Synchronizes sellable inventory between systems',lifecycle:'Pre-production',lifecycleClass:'amber',serviceOwner:'Supply Chain',ownerEmail:'supply-chain-eng@company.com',team:'Infrastructure dependency',infraOwner:'Data Platform',infraEmail:'data-platform@company.com',environments:'Development · Staging',repo:'github.company.com/supply/inventory-sync',activity:'Staging deployment failed yesterday'}
    };

    const infrastructureChanges=[
      {service:'catalog-web',title:'Increase production memory',status:'Complete',statusClass:'',updated:'18 min ago',actor:'Merged by Maya Chen',note:'Capacity alert resolved after yesterday evening traffic increase.',owner:'Commerce Platform',ownerEmail:'commerce-platform@company.com'},
      {service:'checkout-worker',title:'Add queue dead-letter policy',status:'Awaiting review',statusClass:'amber',updated:'1 hr ago',actor:'Submitted by Noah Williams',note:'Security review requested before the production queue policy can merge.',owner:'Cloud Security',ownerEmail:'cloud-security@company.com'},
      {service:'checkout-api',title:'Production infrastructure foundation',status:'Needs input',statusClass:'blue',updated:'Yesterday',actor:'Draft started by Maya Chen',note:'Infrastructure determination has not been completed yet.',owner:'Commerce Platform',ownerEmail:'commerce-platform@company.com'},
      {service:'inventory-sync',title:'Update log retention',status:'Checks running',statusClass:'blue',updated:'2 days ago',actor:'Updated by Priya Singh',note:'Policy evidence regenerated for the Data Platform retention standard.',owner:'Data Platform',ownerEmail:'data-platform@company.com'}
    ];

    const deploymentTurns=[
      {key:'traffic',question:'For checkout-api, production traffic controls the initial autoscaling range. What shape should I assume?',suggestions:['Steady','Spiky around events','Not sure']},
      {key:'data',question:'Does checkout-api process confidential customer data? This changes database, identity, and network controls.',suggestions:['Yes','No','I need help deciding']},
      {key:'decision',question:'I have enough context to use the approved infrastructure foundation. What should I do next?',suggestions:['Use approved foundation','Use default sizing','Show me the proposal']}
    ];

    function escapeHTML(value){const entities={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return String(value).replace(/[&<>"']/g,char=>entities[char])}
    function crumb(items){return `<div class="muted crumb">${items.join(' &nbsp;/&nbsp; ')}</div>`}
    function setTop(){}
    function activateNav(destination){document.querySelectorAll('.nav-btn').forEach(button=>button.classList.toggle('active',button.dataset.destination===destination))}
    function show(view){state.view=view;render();window.scrollTo(0,0)}
    function choose(key,value){state[key]=value;render()}
    function updateTuning(key,value){state[key]=value;state.changed=true;renderProposal()}
    function toggleTuning(){state.tuning=!state.tuning;state.customVariation=false;renderProposal()}
    function toggleCustomVariation(){state.customVariation=!state.customVariation;state.tuning=false;renderProposal()}
    function submitCustomVariation(){
      const reason=document.getElementById('customVariationReason').value.trim();
      if(!reason){document.getElementById('customVariationReason').focus();return}
      state.customReason=reason;
      alert('Mock action: a platform review request would be created with the deployment context and your requested variation.');
    }
    function closeDrawers(){document.getElementById('chatDrawer').classList.add('hidden');document.getElementById('serviceDrawer').classList.add('hidden')}
    function closeChatDrawer(){
      document.getElementById('chatDrawer').classList.add('hidden');
      if(state.view==='prepare'&&state.deploymentConversationComplete)renderPrepare();
    }

    function render(){
      if(state.view==='workspace')return renderApplications();
      if(state.view==='service')return renderServiceOverview();
      if(state.view==='prepare')return renderPrepare();
      if(state.view==='proposal')return renderProposal();
      if(state.view==='review')return renderReview();
      if(state.view==='connect')return renderConnectTools();
      return renderApplications();
    }

    function renderApplications(){
      activateNav('applications');
      setTop('Applications');
      const appCards=Object.entries(applicationCatalog).map(([id,a])=>`
        <article class="card app-list-card">
          <div class="app-list-head">
            <div><div class="label">${a.kind}</div><h2 style="margin-top:4px">${id}</h2></div>
            <span class="pill ${a.lifecycleClass}">${a.lifecycle}</span>
          </div>
          <div class="app-list-body">
            <div class="compact-summary">
              <span>Service owner · <b>${a.serviceOwner}</b></span>
              <span>Email · <b>${a.ownerEmail}</b></span>
              <span>Infra owner · <b>${a.infraOwner}</b></span>
            </div>
          </div>
          <div class="expanded-details ${id==='checkout-api'?'':'hidden'}" id="app-details-${id}">
            <p class="muted">${a.description}</p>
            <div class="row"><span>Current environments</span><span>${a.environments}</span></div>
            <div class="row"><span>GitHub repository</span><span><button class="text-action" onclick="alert('Mock link: opens ${id} in GitHub.')">${a.repo} ↗</button></span></div>
            <div class="row"><span>Service owner email</span><span>${a.ownerEmail}</span></div>
            <div class="row"><span>Infrastructure contact</span><span>${a.infraEmail}</span></div>
            <div class="row"><span>Latest activity</span><span>${a.activity}</span></div>
            ${id==='checkout-api'?'<div class="right-actions" style="margin-top:12px"><button class="btn" onclick="document.getElementById(\'serviceDrawer\').classList.add(\'hidden\');show(\'service\')">Open service workspace</button><button class="btn primary" onclick="startDeploymentConversation()">Determine infrastructure</button></div>':''}
          </div>
          <div class="card-actions"><button class="text-action" onclick="toggleInlineDetails('app-details-${id}',this)">${id==='checkout-api'?'Hide details ↑':'View details →'}</button></div>
        </article>`).join('');
      const changeRows=infrastructureChanges.map(c=>`
        <tr>
          <td><b>${c.service}</b></td>
          <td><b>${c.title}</b><br><small class="muted">${c.note}</small></td>
          <td>${c.actor}</td>
          <td class="nowrap">${c.updated}</td>
          <td><span class="pill ${c.statusClass}">${c.status}</span></td>
          <td>${c.owner}<br><small class="muted">${c.ownerEmail}</small></td>
        </tr>`).join('');
      content.innerHTML=`
        <div class="section-head">
          <div>
            <div class="eyebrow">Signed in as Maya Chen · Commerce Platform</div>
            <h1>Your applications</h1>
            <p class="lede">Services appear here because your team owns, contributes to, or operates part of them. Ownership and lifecycle remain separate.</p>
          </div>
          <button class="btn primary" onclick="openAddService()">Add service</button>
        </div>
        <div class="inventory-tools">
          <input class="search-box" type="search" aria-label="Search applications" placeholder="Search services, repositories, owners, or emails">
          <span class="muted nowrap">12 applications</span>
        </div>
        <div class="grid">${appCards}</div>

    function askCompassQuestion(key){const answers={
      'why-listed':'checkout-api appears because Commerce Platform is its service owner in the catalog and Maya is signed in as a member of that team. Repository and catalog records keep the association current.',
      'ownership':'Service ownership and infrastructure operations are separate. Commerce Platform owns checkout-api at commerce-platform@company.com; Cloud Platform operates its production infrastructure at cloud-platform@company.com.',
      'add-service':'Use Add service from the Applications page. The developer connects a repository, assigns service and infrastructure owner emails, and Compass scans for runtime, dependencies, and environment context.',
      'known':'Compass found the Node.js runtime, container entrypoint, PostgreSQL dependency, current environments, ownership, and telemetry integration from approved repository and platform sources.',
      'prod-ready':'checkout-api currently runs in development and staging. Production requires an infrastructure determination, an approved proposal, deterministic policy checks, and GitHub review.',
      'start-deploy':'I can run the infrastructure-determination conversation from this drawer. Use the Determine infrastructure button to start the scripted flow.',
      'availability':'A 99.95% target adds stronger redundancy and raises the expected cost class. Compass can propose the change, but you must apply it explicitly.',
      'confidential':'Confidential data requires an encrypted managed database, private data-plane access, narrower identity permissions, and the applicable data policy evidence.',
      'postgres':'The repository already contains a PostgreSQL client and migrations. The managed PostgreSQL module is the approved pattern for this availability and data classification.',
      'tuning':'You can tune the approved settings shown in the proposal, such as availability tier, allowed region, and capacity tier. Larger deviations move into a platform review request.',
      'policy':'PLAT-001 shaped runtime, DATA-012 encryption and availability, NET-019 network exposure, IAM-007 identity, and OBS-003 telemetry.',
      'reviewer':'Cloud Platform operates the proposed production runtime, so it reviews the module and capacity change. Commerce Platform remains the service owner.',
      'github':'Compass creates the infrastructure PR. GitHub then owns the real diff, CI checks, comments, approvals, and merge. Compass only summarizes that status.',
      'mcp':'The MCP connection lets an approved IDE assistant read Compass application context and request bounded platform actions through a standard tool interface. It does not grant direct cloud access.',
      'token':'Use a scoped API token only for an approved custom script or integration that cannot use enterprise sign-in. IDE connections should use organization sign-in instead of copied secrets.',
      'permissions':'From the IDE, Compass can identify the current repository, explain platform context, prepare an infrastructure proposal, and open the portal review. It cannot approve, merge, or provision.',
      'help':'A platform-help request would include checkout-api, the confirmed requirements, current proposal, policy evidence, and the unresolved question so the developer does not repeat the context.'
    };return answers[key]||'I can help explain this context or prepare the next step, but that action is outside this scripted prototype.'}

    function scrollChatToBottom(){
      const body=document.querySelector('#chatDrawer .chat-body');
      const bottom=document.getElementById('chatBottom');
      if(!body)return;
      const jump=()=>{
        body.scrollTop=body.scrollHeight;
        if(bottom)bottom.scrollIntoView({block:'end',inline:'nearest'});
      };
      requestAnimationFrame(()=>{
        jump();
        requestAnimationFrame(jump);
        setTimeout(jump,80);
      });
    }

    function addChatExchange(label,key){
      const thread=document.getElementById('chatThread');
      if(key==='start-deploy')return startDeploymentConversation();
      thread.insertAdjacentHTML('beforeend',`<div class="user-message">${escapeHTML(label)}</div><div class="assistant-message"><div class="label" style="color:var(--purple);margin-bottom:4px">Compass</div>${askCompassQuestion(key)}</div>`);
      scrollChatToBottom();
    }

    function sendMockPrompt(){
      const input=document.getElementById('chatInput');
      const value=input.value.trim();
      if(!value)return;
      const context=compassConfig().context;
      const thread=document.getElementById('chatThread');
      thread.insertAdjacentHTML('beforeend',`<div class="user-message">${escapeHTML(value)}</div><div class="assistant-message"><div class="label" style="color:var(--purple);margin-bottom:4px">Compass</div>I’m using <b>${context}</b>. In this concept prototype I can explain the available context, prepare a bounded next step, or route you to the structured portal action. I cannot approve, merge, or provision.</div>`);
      input.value='';
      scrollChatToBottom();
    }

    function openCompass(){
      document.getElementById('serviceDrawer').classList.add('hidden');
      const cfg=compassConfig();
      document.getElementById('chatContext').innerHTML=`<div class="label">Current context</div><b>${cfg.context}</b>`;
      document.getElementById('chatPromptLabel').textContent='Things you can ask Compass to do';
      document.getElementById('chatPrompts').innerHTML=cfg.prompts.map(([key,label])=>`<button onclick="addChatExchange(this.textContent,'${key}')">${label}</button>`).join('');
      document.getElementById('chatThread').innerHTML='<div class="assistant-message"><div class="label" style="color:var(--purple);margin-bottom:4px">Compass</div>I can help with this page using the application and platform context already available. What would you like to understand or prepare?</div>';
      document.getElementById('chatDrawer').classList.remove('hidden');
      scrollChatToBottom();
    }

    function startDeploymentConversation(){
      state.view='prepare';
      renderPrepare();
      state.deployStep=0;
      state.deploymentConversationComplete=false;
      document.getElementById('serviceDrawer').classList.add('hidden');
      document.getElementById('chatContext').innerHTML=`<div class="label">Current resource</div><b>checkout-api · Production not provisioned</b><div class="muted" style="margin-top:7px">Repo commerce/checkout-api · Node.js 20 · PostgreSQL · Service owner commerce-platform@company.com</div>`;
      document.getElementById('chatPromptLabel').textContent='Suggested answers';
      document.getElementById('chatThread').innerHTML='<div class="assistant-message"><div class="label" style="color:var(--purple);margin-bottom:4px">Compass</div>I found checkout-api, its repository, owners, runtime, database dependency, and staging health. I only need a few deployment assumptions to choose an approved infrastructure pattern.</div>';
      document.getElementById('chatDrawer').classList.remove('hidden');
      renderDeploymentTurn();
    }

    function renderDeploymentTurn(){
      const turn=deploymentTurns[state.deployStep];
      const thread=document.getElementById('chatThread');
      thread.insertAdjacentHTML('beforeend',`<div class="assistant-message"><div class="label" style="color:var(--purple);margin-bottom:4px">Compass</div>${turn.question}</div>`);
      document.getElementById('chatPrompts').innerHTML=turn.suggestions.map(value=>`<button onclick="answerDeploymentTurn('${escapeHTML(value)}')">${escapeHTML(value)}</button>`).join('');
      scrollChatToBottom();
    }

    function answerDeploymentTurn(value){
      const turn=deploymentTurns[state.deployStep];
      if(turn.key==='traffic')state.traffic=value;
      if(turn.key==='data')state.data=value;
      if(turn.key==='decision')state.pattern='standard';
      const thread=document.getElementById('chatThread');
      thread.insertAdjacentHTML('beforeend',`<div class="user-message">${escapeHTML(value)}</div>`);
      state.deployStep+=1;
      if(state.deployStep<deploymentTurns.length){
        renderDeploymentTurn();
      }else{
        if(!state.traffic)state.traffic='Steady';
        if(!state.data)state.data='Yes';
        state.deploymentConversationComplete=true;
        thread.insertAdjacentHTML('beforeend','<div class="assistant-message"><div class="label" style="color:var(--purple);margin-bottom:4px">Compass</div>I recommend the approved container API foundation: managed container service, managed PostgreSQL, API gateway, workload identity, and standard telemetry. I can open the proposal now.</div>');
        document.getElementById('chatPromptLabel').textContent='Next step';
        document.getElementById('chatPrompts').innerHTML='<button class="primary-prompt" onclick="openProposalFromChat()">Open infrastructure proposal</button>';
      }
      scrollChatToBottom();
    }

    function openProposalFromChat(){
      document.getElementById('chatDrawer').classList.add('hidden');
      show('proposal');
    }

    document.querySelectorAll('.nav-btn').forEach(button=>button.addEventListener('click',()=>{
      const destination=button.dataset.destination;
      if(destination==='applications')show('workspace');
      else if(destination==='deploy')show('prepare');
      else if(destination==='connect')show('connect');
      else alert('This destination is not implemented in the assessment prototype.');
    }));
    document.getElementById('askCompass').addEventListener('click',openCompass);
    document.getElementById('closeChat').addEventListener('click',closeChatDrawer);
    document.getElementById('sendChat').addEventListener('click',sendMockPrompt);
    document.getElementById('chatInput').addEventListener('keydown',event=>{if(event.key==='Enter')sendMockPrompt()});
    document.getElementById('closeServiceDrawer').addEventListener('click',()=>document.getElementById('serviceDrawer').classList.add('hidden'));
    render();
  </script>
</body>
</html>
